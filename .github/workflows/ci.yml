name: Firmware CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_GNU_TOOLCHAIN_VERSION: "15.3.rel1"
  ARM_GNU_TOOLCHAIN_SHA256: "563bebb2b97d53382b956d6ee1fe61e2cae26699901417234a37df505ef9b5fa"

jobs:
  build-test:
    name: Build and test firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang python3-tk xauth xvfb xz-utils zip
          python3 -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v6
        with:
          path: ~/arm-gnu-toolchain-${{ env.ARM_GNU_TOOLCHAIN_VERSION }}-x86_64-arm-none-eabi
          key: arm-gnu-toolchain-${{ runner.os }}-x86_64-${{ env.ARM_GNU_TOOLCHAIN_VERSION }}

      - name: Install Arm GNU Toolchain
        run: |
          set -euo pipefail
          toolchain_name="arm-gnu-toolchain-${ARM_GNU_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi"
          toolchain_dir="${HOME}/${toolchain_name}"
          archive="${RUNNER_TEMP}/${toolchain_name}.tar.xz"

          if [[ ! -x "${toolchain_dir}/bin/arm-none-eabi-gcc" ]]; then
            curl --fail --location --retry 3 \
              --output "${archive}" \
              "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/${ARM_GNU_TOOLCHAIN_VERSION}/${toolchain_name}.tar.xz"
            echo "${ARM_GNU_TOOLCHAIN_SHA256}  ${archive}" | sha256sum --check --strict
            tar --extract --xz --file "${archive}" --directory "${HOME}"
            rm -f "${archive}"
          fi

          "${toolchain_dir}/bin/arm-none-eabi-gcc" --version | head -n 1
          echo "${toolchain_dir}/bin" >> "${GITHUB_PATH}"

      - name: Run host tests
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum ./tests/host/p7/run_tests.sh
          ./tests/host/board_b/run_tests.sh
          ./tests/host/sd_spi/run.sh

      - name: Build remaining firmware targets
        run: |
          set -euo pipefail
          ./firmware/build/build.sh
          ./firmware/build/build.sh sd

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}." >&2
            exit 1
          fi

      - name: Package firmware
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          stage="release-assets/stage"

          mkdir -p \
            "${stage}/board-a" \
            "${stage}/board-b" \
            "${stage}/bringup" \
            "${stage}/sd-bringup"

          cp build/board_a/board_a.elf \
             build/board_a/board_a.bin \
             build/board_a/board_a.hex \
             build/board_a/board_a.map \
             "${stage}/board-a/"
          cp build/board_b/buscomm_board_b.elf \
             build/board_b/buscomm_board_b.bin \
             build/board_b/buscomm_board_b.hex \
             build/board_b/buscomm_board_b.map \
             "${stage}/board-b/"
          cp build/buscomm.elf \
             build/buscomm.bin \
             build/buscomm.hex \
             build/buscomm.map \
             "${stage}/bringup/"
          cp build/buscomm_sd.elf \
             build/buscomm_sd.bin \
             build/buscomm_sd.hex \
             build/buscomm_sd.map \
             "${stage}/sd-bringup/"

          (
            cd "${stage}"
            zip --quiet --recurse-paths "../board-a-v${version}.zip" board-a
            zip --quiet --recurse-paths "../board-b-v${version}.zip" board-b
            zip --quiet --recurse-paths "../bringup-v${version}.zip" bringup
            zip --quiet --recurse-paths "../sd-bringup-v${version}.zip" sd-bringup
          )
          rm -rf "${stage}"

          cat > release-assets/BUILD_INFO.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          workflow_run=${GITHUB_RUN_ID}
          ref=${GITHUB_REF}
          commit=${GITHUB_SHA}
          version=${version}
          toolchain=$(arm-none-eabi-gcc --version | head -n 1)
          runner_image=${ImageOS}-${ImageVersion}
          source_date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          (
            cd release-assets
            for file in ./*.zip BUILD_INFO.txt; do
              sha256sum "${file}"
            done > SHA256SUMS
          )

          cat release-assets/SHA256SUMS

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: release-assets/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish firmware release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
